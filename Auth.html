<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkillNaija - Login & Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17221b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      color: #16834b;
      font-size: 32px;
    }

    .logo p {
      margin-top: 6px;
      color: #66736c;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      border: none;
      background: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #777;
    }

    .tab.active {
      color: #16834b;
      border-bottom: 3px solid #16834b;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ddd8;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #16834b;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16834b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #10683b;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .success {
      background: #e5f7ec;
      color: #116b3d;
    }

    .error {
      background: #fde8e8;
      color: #b42318;
    }

    .hidden {
      display: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #16834b;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>SkillNaija</h1>
    <p>Learn. Build. Earn.</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button id="loginTab" class="tab active">
        Login
      </button>

      <button id="registerTab" class="tab">
        Register
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN -->

    <div id="loginForm">

      <h2>Welcome back 👋</h2>

      <label>Email</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Your password"
        required
      >

      <button class="btn" id="loginButton">
        Login
      </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

      <h2>Create your account 🚀</h2>

      <label>Full Name</label>

      <input
        type="text"
        id="registerName"
        placeholder="Your full name"
        required
      >

      <label>Email</label>

      <input
        type="email"
        id="registerEmail"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="registerPassword"
        placeholder="At least 6 characters"
        required
      >

      <button class="btn" id="registerButton">
        Create Account
      </button>

    </div>

    <a href="index.html" class="back">
      ← Back to SkillNaija
    </a>

  </div>

</div>


<script>

  // ===============================
  // SUPABASE CONFIGURATION
  // ===============================

  const SUPABASE_URL =
    "https://czbxutlyceenwvdpgvdn.supabase.co";

  const SUPABASE_KEY =
    "YOUR_PUBLISHABLE_KEY_HERE";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ===============================
  // ELEMENTS
  // ===============================

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const message =
    document.getElementById("message");


  // ===============================
  // MESSAGE
  // ===============================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  function hideMessage() {

    message.style.display = "none";

  }


  // ===============================
  // SWITCH TABS
  // ===============================

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.remove("hidden");

    registerForm.classList.add("hidden");

    hideMessage();

  });


  registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.remove("hidden");

    loginForm.classList.add("hidden");

    hideMessage();

  });


  // ===============================
  // REGISTER
  // ===============================

  document
    .getElementById("registerButton")
    .addEventListener("click", async () => {

      const name =
        document
          .getElementById("registerName")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("registerPassword")
          .value;


      if (!name || !email || !password) {

        showMessage(
          "Please fill in all fields.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById("registerButton");

      button.disabled = true;

      button.textContent =
        "Creating account...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      button.disabled = false;

      button.textContent =
        "Create Account";


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Account created successfully! Check your email if confirmation is required.",
        "success"
      );

    });


  // ===============================
  // LOGIN
  // ===============================

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById("loginButton");

      button.disabled = true;

      button.textContent =
        "Logging in...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      button.disabled = false;

      button.textContent =
        "Login";


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Login successful! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 800);

    });


  // ===============================
  // CHECK EXISTING SESSION
  // ===============================

  async function checkSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      window.location.href =
        "dashboard.html";

    }

  }


  checkSession();

</script>

</body>
</html>
